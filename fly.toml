# Fly.io app config. Rename `app` to a globally-unique name before first deploy
# (`flyctl launch --no-deploy` will generate one and fill [build]/[http_service] for you).
app = "jobagents"
primary_region = "sin"   # Singapore — closest free region; change to taste.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080         # matches ASPNETCORE_URLS in the Dockerfile
  force_https = true
  auto_stop_machines = true    # scale to zero when idle (free-tier friendly)
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
