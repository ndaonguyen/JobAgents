name: CD

# Continuous delivery: on every push to main, run the test suite, then build a container image and
# publish it to the GitHub Container Registry (GHCR — free, no extra account). A Fly.io deploy then
# runs only if a FLY_API_TOKEN secret is present, so the pipeline stays green before any host is
# configured. The Fly deploy reuses the exact image built here (by SHA), so tested == deployed.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys for the same ref at once; let an in-flight deploy finish (don't cancel it).
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write           # needed to push to GHCR
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      # Gate the image build on a passing test suite — never publish/deploy an untested commit.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Gate on unit/integration tests. E2E is excluded here — it needs a live server + browser
      # (booted in CI's dedicated e2e job on PRs); running it in CD without a server always fails.
      - name: Test
        run: dotnet test JobAgents.sln --configuration Release --verbosity normal --filter "FullyQualifiedName!~JobAgents.E2E"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx with the docker-container driver — required for GHA cache export (cache-to: type=gha).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Produces lowercased, properly-tagged image refs (latest + commit SHA).
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lowercased, immutable by-SHA ref of the image just pushed — consumed by the deploy job.
      - name: Compute image ref
        id: ref
        env:
          REPO: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPO,,}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-fly:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level secrets can't be read in `if`, so surface the token as an env var and gate on it.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip notice
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN not set — skipping deploy. Add the secret to enable Fly.io deploys."

      - uses: actions/checkout@v6
        if: ${{ env.FLY_API_TOKEN != '' }}

      - name: Setup flyctl
        if: ${{ env.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@v1

      # Deploy the exact image built+tested above (by SHA) — no rebuild. Uses fly.toml in the repo root.
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --image ${{ needs.image.outputs.image }}
