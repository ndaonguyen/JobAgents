name: CD

# Continuous delivery: on every push to main, build a container image and publish it to the
# GitHub Container Registry (GHCR — free, no extra account). A Fly.io deploy then runs only if a
# FLY_API_TOKEN secret is present, so the pipeline stays green before any host is configured.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # needed to push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces lowercased, properly-tagged image refs (latest + commit SHA).
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-fly:
    needs: image
    runs-on: ubuntu-latest
    # Job-level secrets can't be read in `if`, so surface the token as an env var and gate on it.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip notice
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN not set — skipping deploy. Add the secret to enable Fly.io deploys."

      - uses: actions/checkout@v4
        if: ${{ env.FLY_API_TOKEN != '' }}

      - name: Setup flyctl
        if: ${{ env.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploys using fly.toml in the repo root. Free-tier Fly machine, scales to zero when idle.
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only
