name: CI

# Build and test on every push to main and on every PR targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't stack.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write             # test-reporter publishes a check run with results
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Honours global.json (SDK 9.0.x, rollForward latestFeature).
          global-json-file: global.json

      # Cache the NuGet package cache keyed on the lock-free central package list.
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore JobAgents.sln

      - name: Build
        run: dotnet build JobAgents.sln --configuration Release --no-restore

      # `dotnet test` only runs projects marked IsTestProject — the Evals console app is skipped.
      # TRX logger writes machine-readable results for the reporter step below.
      - name: Test
        run: dotnet test JobAgents.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      # Publish a check run with per-test pass/fail — visible in the PR without digging through logs.
      # Runs even when tests fail so failures surface in the UI.
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
