name: CI

# Build and test on every push to main and on every PR targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't stack.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write             # test-reporter publishes a check run with results
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Honours global.json (SDK 9.0.x, rollForward latestFeature).
          global-json-file: global.json

      # Cache the NuGet package cache keyed on the lock-free central package list.
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore JobAgents.sln

      - name: Build
        run: dotnet build JobAgents.sln --configuration Release --no-restore

      # `dotnet test` only runs projects marked IsTestProject — the Evals console app is skipped.
      # E2E tests need a running server + browser, so they run in the dedicated `e2e` job below.
      # TRX logger writes machine-readable results for the reporter step below.
      - name: Test
        run: dotnet test JobAgents.sln --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~JobAgents.E2E" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      # Publish a check run with per-test pass/fail — visible in the PR without digging through logs.
      # Runs even when tests fail so failures surface in the UI.
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx

  # SonarCloud static analysis + coverage. The 80%-on-new-code quality gate is enforced by
  # SonarCloud's own "SonarCloud Code Analysis" GitHub check (require it in branch protection),
  # not by this job — the scanner's qualitygate.wait call is unreliable against api.sonarcloud.io.
  # This job just runs the scan and uploads coverage.
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_ORG: ndaonguyen                # SonarCloud organization key — confirm/edit
      SONAR_PROJECT_KEY: ndaonguyen_JobAgents  # SonarCloud project key — confirm/edit
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history for accurate blame / new-code detection.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The Sonar scanner for .NET runs on the JVM.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache SonarCloud scanner
        uses: actions/cache@v5
        with:
          path: ~/.dotnet/tools
          key: sonar-tools-${{ runner.os }}

      - name: Install Sonar + coverage tools
        run: |
          dotnet tool install --global dotnet-sonarscanner || dotnet tool update --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage || dotnet tool update --global dotnet-coverage

      - name: Restore
        run: dotnet restore JobAgents.sln

      # The scanner hooks MSBuild, so begin -> build -> test(+coverage) -> end must run in order.
      # E2E is excluded (needs a live server + browser; it runs in the dedicated e2e job).
      - name: SonarCloud analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORG" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/Components/**/*.razor,**/Components/**/*.razor.cs,eval/**,**/*.g.cs,web-react/**" \
            /d:sonar.exclusions="eval/**,**/*.g.cs,web-react/**"
          dotnet build JobAgents.sln --configuration Release --no-restore
          dotnet-coverage collect \
            "dotnet test JobAgents.sln --configuration Release --no-build --filter FullyQualifiedName!~JobAgents.E2E" \
            -f xml -o coverage.xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Browser end-to-end tests: boot the real web app (no API keys needed — the no-key
  # tests only exercise navigation/form UI, never the LLM agents) and drive it with Playwright.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore JobAgents.sln

      - name: Build
        run: dotnet build JobAgents.sln --configuration Release --no-restore

      # playwright.ps1 ships in the test project's build output; --with-deps installs the OS
      # libraries Chromium needs on the runner.
      - name: Install Playwright browsers
        run: pwsh tests/JobAgents.E2E/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      # Start the app on a fixed http port in the background. No HTTPS endpoint, so
      # UseHttpsRedirection is a no-op (it just logs a warning).
      - name: Start web app
        env:
          ASPNETCORE_URLS: http://localhost:5221
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --project src/JobAgents.Web -c Release --no-build --no-launch-profile > web.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5221 >/dev/null 2>&1; then echo "app is up"; exit 0; fi
            sleep 1
          done
          echo "::error::web app did not start within 60s"; cat web.log; exit 1

      - name: E2E tests
        env:
          E2E_BASE_URL: http://localhost:5221
        run: dotnet test tests/JobAgents.E2E/JobAgents.E2E.csproj -c Release --no-build --logger "trx;LogFileName=e2e-results.trx" --results-directory TestResults

      - name: Stop web app
        if: always()
        run: kill "$WEB_PID" 2>/dev/null || true

      - name: Publish E2E results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: E2E Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx

  # React front end: type-check + production build, then a Playwright smoke run that boots the
  # JobAgents.Api backend and the Vite dev server and drives the SPA (no API keys needed — the
  # smoke spec only exercises navigation + the API-backed Settings catalog, never the LLM agents).
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      # Pre-build the API so the Playwright webServer (dotnet run) starts fast and deterministically.
      - name: Build API
        working-directory: .
        run: dotnet build src/JobAgents.Api/JobAgents.Api.csproj -c Release

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web-react/playwright-report
          retention-days: 7
