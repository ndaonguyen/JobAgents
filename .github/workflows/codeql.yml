name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) to catch advisories on unchanged code.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write    # upload findings to the Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # security-and-quality adds maintainability/quality queries on top of the default set.
          queries: security-and-quality

      # Build with autobuild disabled — explicit build is more reliable for the .NET SDK.
      - name: Build
        run: dotnet build JobAgents.sln --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
